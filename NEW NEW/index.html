<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="style.css" />
    <!-- Boxicons CDN -->
    <link
      href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <!-- HEADER -->
    <header class="header">
      <div class="logo">LOGO</div>

      <nav class="nav" id="nav-menu">
        <a href="#">Home</a>
        <a href="#">Products</a>
        <a href="#">Solution</a>
        <a href="#">Contact Us</a>
        <a href="#">Blog</a>
      </nav>

      <!-- TOGGLE ICON -->
      <button id="menu-toggle" aria-label="Toggle Menu">
        <i class="bx bx-menu" id="menu-icon"></i>
      </button>

      <button class="nav_btn">Dashboard</button>
    </header>

    <!-- MAIN SECTION -->
    <section class="hero">
      <div class="hero-content">
        <h1>World's Best Source Of Clean & Fresh Professional Data</h1>
        <p>
          Access the most complete global dataset of professional aggregates
          across various sectors.
        </p>
        <div class="buttons">
          <button type="button">Request a Demo</button>
          <button type="button">Watch a Video</button>
        </div>
      </div>

      <video class="video" loop autoplay muted width="500">
        <source src="video.mp4" type="video/mp4" />
        Your browser does not support the video tag.
      </video>
    </section>

    <script src="app.js"></script>
  </body>
</html>
